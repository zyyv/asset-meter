name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6

      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm package
      - run: pnpm exec vitest run

      - name: Publish to Visual Studio Marketplace
        run: pnpm exec vsce publish --packagePath assets-size-*.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish --packagePath assets-size-*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}

      - name: Create GitHub Release and upload VSIX
        uses: softprops/action-gh-release@v3
        with:
          files: assets-size-*.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
